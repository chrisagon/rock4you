name = "rock4you-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "rock4you-api"

[env.staging]
name = "rock4you-api-staging"

[[d1_databases]]
binding = "DB"
database_name = "rock4you-prod"
database_id = "ea166c89-e85b-4455-86ef-29191762bbd2"

[vars]
# JWT_SECRET est un secret Cloudflare (wrangler secret put). Sa valeur locale de developpement vit dans worker/.dev.vars.
# Autoriser plusieurs origines (séparées par des virgules). Doivent correspondre exactement à l'origin du frontend.
# Exemple: Pages par défaut + éventuel domaine custom
CORS_ORIGIN = "https://rock4me.pages.dev, https://rock4you-frontend.pages.dev, https://rock4you.pages.dev"
DEFAULT_FAVORITES_LIST_NAME = "Mes Favoris"

# Variables d'environnement pour le développement local
[env.development]
[env.development.vars]
JWT_SECRET = "IPVENKq6Yg-IYk747VNYIMSqHrDYiNnxCqx3EWLxXOZww3l1fbgSZN_5ADClLoXj"
CORS_ORIGIN = "*"

[[env.development.d1_databases]]
binding = "DB"
database_name = "rock4you-db-dev"
database_id = "your-dev-database-id-here"
